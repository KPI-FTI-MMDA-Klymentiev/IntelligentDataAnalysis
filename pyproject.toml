[project]
name = "ml-learn"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn",
    "numpy",
    "matplotlib",
    "seaborn",
    "pandas",
    "wordcloud",
    "torchvision",
    "ipykernel",
    "openpyxl"
]

[project.optional-dependencies]
cpu = [
    "torch>=2.7.0",
]
cu130 = [
    "torch>=2.7.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true